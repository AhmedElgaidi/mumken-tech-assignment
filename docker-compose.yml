# One command: `docker compose up --build`. No .env needed: every variable is set here.
x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://app:app@postgres:5432/ingestion
  REDIS_URL: redis://redis:6379
  API_KEY: ${API_KEY:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: ingestion
    ports: ['127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d ingestion']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:${REDIS_HOST_PORT:-6379}:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: .
    command: ['node_modules/.bin/sequelize-cli', 'db:migrate']
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    build: .
    command: ['node', 'dist/main.js']
    environment:
      <<: *app-env
      PORT: 3000
    ports: ['127.0.0.1:${API_HOST_PORT:-3000}:3000']
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/api/v1/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    stop_grace_period: 30s
    restart: unless-stopped


volumes:
  pgdata:
